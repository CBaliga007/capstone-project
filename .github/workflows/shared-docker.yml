name: Reusable Docker Build and Push

on:
  workflow_call:
    inputs:
      image-name:
        description: GHCR image name without registry prefix
        type: string
        required: true
        default: ""
    outputs:
      image-digest:
        description: Published container image digest
        value: ${{ jobs.docker-build.outputs.digest }}

permissions:
  contents: read
  packages: write

jobs:
  docker-build:
    name: Build and publish image
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      owner: ${{ github.actor }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Normalize owner name
        id: normalize-owner
        run: |
          echo "OWNER=$(echo ${{ github.actor }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.OWNER }}/${{ inputs.image-name }}:${{ github.sha }}

name: Reusable Docker Build and Push

on:
  workflow_call:
    inputs:
      image-name:
        description: GHCR image name without registry prefix
        type: string
        required: true
        default: ""
      cr-pat:
        description: Personal access token for GHCR
        type: string
        required: true
        default: ""
    outputs:
      image-digest:
        description: Published container image digest
        value: ${{ jobs.docker-build.outputs.digest }}

permissions:
  contents: read

jobs:
  docker-build:
    name: Build and publish image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ inputs.cr-pat }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}:${{ github.sha }}
      # - name: Attest image provenance
      #   uses: actions/attest-build-provenance@v2
      #   with:
      #     subject-name: ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}
      #     subject-digest: ${{ steps.build.outputs.digest }}
      #     push-to-registry: true

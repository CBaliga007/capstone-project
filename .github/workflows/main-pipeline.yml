name: GlobalCart Main Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CR_PAT: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

  shared-docker-workflow:
    needs: test-lint
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/shared-docker.yml
    with:
      image-name: capstone-globalcart
      cr-pat: $CR_PAT

  deploy-prod:
    needs: shared-docker-workflow
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://company.com
    steps:
      - name: Deploy to production
        run: echo "Deploying ${IMAGE_DIGEST} to production..."
